<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>داشبورد عملیات</title>

    <link rel="stylesheet" href="Attack.css">
</head>


<body>

<div class="container">

    <h1>⚔️ داشبورد عملیات ⚔️</h1>


    <div class="card">


        <label>👤 نام پلیر</label>
        <input id="player" type="text" placeholder="نام پلیر">


        <label>🛡️ نوع نیرو</label>
        <input id="troop" type="text" placeholder="مثال: شمشیرزن">


        <label>🔢 تعداد نیرو</label>
        <input id="count" type="number">


        <label>🎒 تعداد آیتم</label>
        <input id="items" type="number">


        <label>📍 لوکیشن پلیر</label>
        <input id="location" type="text">


        <label>🕵️ گزارش جاسوسی دشمن</label>
        <textarea id="spy"></textarea>


        <label>🎯 تارگت</label>
        <input id="target" type="text">


        <label>📌 لوکیشن حمله</label>
        <input id="attackLocation" type="text">


        <label>⏰ زمان حمله</label>
        <input id="attackTime" type="datetime-local">


        <label>📝 توضیحات</label>
        <textarea id="notes"></textarea>


        <button onclick="saveMission()">
            💾 ثبت عملیات
        </button>


    </div>



    <h2>📋 لیست عملیات</h2>

<button onclick="showMissions()">
    📋 Operationen anzeigen
</button>


<div id="missions"></div>


</div>


<div id="missions"></div>
<script type="module" src="Attack.js"></script>


</body>
</html>
