<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اتاق جنگ | پایگاه فرماندهی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #0f141c;
  --bg-grid: #141b26;
  --panel: #1a222d;
  --panel-2: #212b38;
  --border: #2b3849;
  --gold: #c9a227;
  --gold-dim: #8a721e;
  --steel: #7c93ab;
  --red: #b8433a;
  --green: #5f8d5b;
  --text: #e9e4d6;
  --text-muted: #93a0ae;
  --radius: 10px;
  --font: 'Vazirmatn', Tahoma, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family: var(--font);
  background:
    radial-gradient(ellipse at top left, rgba(201,162,39,0.06), transparent 55%),
    repeating-linear-gradient(0deg, var(--bg-grid) 0 1px, transparent 1px 48px),
    repeating-linear-gradient(90deg, var(--bg-grid) 0 1px, transparent 1px 48px),
    var(--bg);
  color: var(--text);
  min-height:100vh;
  direction: rtl;
}
::selection{ background: var(--gold); color:#1a1a1a; }
button{ font-family: var(--font); cursor:pointer; }
input, textarea{ font-family: var(--font); }
a{ color:inherit; text-decoration:none; }

/* ---------- Centered page (login) ---------- */
body.center-page{ display:flex; align-items:center; justify-content:center; padding:20px; min-height:100vh; }

.login-card{
  width:100%; max-width:380px;
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  border:1px solid var(--border);
  border-radius: var(--radius);
  padding:34px 28px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.45);
  position:relative;
  overflow:hidden;
}
.login-card::before{
  content:"";
  position:absolute; inset:0;
  background: linear-gradient(120deg, transparent 40%, rgba(201,162,39,0.08) 50%, transparent 60%);
  pointer-events:none;
}
.badge-emblem{
  width:64px; height:64px; margin:0 auto 14px;
  display:flex; align-items:center; justify-content:center;
}
.login-card h1{
  text-align:center; font-size:20px; font-weight:800; letter-spacing:.5px;
  margin:0 0 4px; color: var(--gold);
}
.login-card p.sub{
  text-align:center; color:var(--text-muted); font-size:13px; margin:0 0 24px;
}
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:12px; color:var(--text-muted); margin-bottom:6px; }
.field input{
  width:100%; padding:11px 12px; border-radius:8px;
  border:1px solid var(--border); background:#141b24; color:var(--text);
  font-size:14px; outline:none; transition: border-color .15s;
}
.field input:focus{ border-color: var(--gold); }
.btn{
  width:100%; padding:12px; border-radius:8px; border:none;
  font-weight:700; font-size:14px; letter-spacing:.3px; transition: transform .1s, filter .15s;
}
.btn:active{ transform: scale(.98); }
.btn-gold{ background: linear-gradient(180deg,#dab741,var(--gold)); color:#1a1300; }
.btn-gold:hover{ filter:brightness(1.08); }
.btn-outline{ background:transparent; border:1px solid var(--border); color:var(--text); }
.btn-outline:hover{ border-color: var(--gold); color: var(--gold); }
.btn-red{ background: linear-gradient(180deg,#cf5148,var(--red)); color:#fff; }
.btn-sm{ padding:7px 12px; font-size:12px; width:auto; border-radius:6px; }
.login-error{
  color:#ff9d92; font-size:12px; text-align:center; min-height:16px; margin-bottom:8px;
}
.first-run-box{
  margin-top:18px; padding:14px; border-radius:8px;
  background:#141b24; border:1px dashed var(--gold-dim);
  font-size:12.5px; line-height:1.9; color: var(--text-muted);
}
.first-run-box b{ color:var(--gold); }
.code-pill{
  display:inline-block; direction:ltr; background:#0f141c; border:1px solid var(--border);
  padding:2px 8px; border-radius:5px; color:var(--text); font-family: 'Courier New', monospace; letter-spacing:1px;
}

/* ---------- Shared layout ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 22px; background: var(--panel);
  border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:10;
}
.topbar .who{ display:flex; align-items:center; gap:10px; }
.rank-badge{ width:30px; height:30px; flex:none; }
.who-name{ font-size:13px; font-weight:700; }
.who-role{ font-size:11px; color: var(--text-muted); }
.topbar-actions{ display:flex; gap:8px; }
.icon-btn{
  background:transparent; border:1px solid var(--border); color:var(--text-muted);
  border-radius:7px; padding:8px 12px; font-size:12px; display:flex; align-items:center; gap:6px;
}
.icon-btn:hover{ color: var(--gold); border-color: var(--gold); }

.container{ max-width:900px; margin:0 auto; padding:26px 18px 60px; }
.page-title{ display:flex; align-items:center; gap:10px; margin-bottom:22px; }
.page-title h2{ margin:0; font-size:19px; font-weight:800; }
.page-title .eyebrow{ font-size:11px; color:var(--gold); letter-spacing:1px; }

/* ---------- Menu ---------- */
.menu-grid{
  display:grid; grid-template-columns: repeat(2, 1fr); gap:16px;
  max-width:640px; margin:40px auto 0; padding:0 18px;
}
@media(max-width:520px){ .menu-grid{ grid-template-columns:1fr; } }
.tile{
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  border:1px solid var(--border); border-radius: var(--radius);
  padding:26px 18px; text-align:center; transition: transform .15s, border-color .15s;
  display:flex; flex-direction:column; align-items:center; gap:10px;
  width:100%;
}
.tile:hover{ transform: translateY(-3px); border-color: var(--gold); }
.tile .tile-icon{ width:38px; height:38px; }
.tile .tile-label{ font-size:14px; font-weight:700; }
.tile .tile-sub{ font-size:11px; color:var(--text-muted); }
.menu-header{ text-align:center; margin-top:26px; }
.menu-header .emblem-lg{ width:56px; height:56px; margin:0 auto 10px; }
.menu-header h2{ margin:0; font-size:20px; }
.menu-header p{ color:var(--text-muted); font-size:12.5px; margin-top:4px; }

/* ---------- Cards / posts ---------- */
.composer{
  background: var(--panel); border:1px solid var(--border); border-radius: var(--radius);
  padding:16px; margin-bottom:20px;
}
.composer textarea{
  width:100%; min-height:70px; resize:vertical; background:#141b24; color:var(--text);
  border:1px solid var(--border); border-radius:8px; padding:10px; font-size:13.5px; outline:none;
}
.composer textarea:focus{ border-color: var(--gold); }
.composer-foot{ display:flex; justify-content:flex-end; margin-top:10px; }
.composer-foot .btn{ width:auto; padding:9px 20px; }

.post{
  background: var(--panel); border:1px solid var(--border); border-radius: var(--radius);
  padding:16px 16px 10px; margin-bottom:14px;
}
.post.attack{ border-inline-start:3px solid var(--red); }
.post.notice{ border-inline-start:3px solid var(--gold); }
.post-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.post-author{ display:flex; align-items:center; gap:8px; font-size:12.5px; }
.author-badge{ width:20px; height:20px; }
.post-time{ font-size:11px; color:var(--text-muted); }
.post-text{ font-size:14px; line-height:1.9; white-space:pre-wrap; margin:6px 0 12px; }
.post-actions{ display:flex; gap:14px; border-top:1px solid var(--border); padding-top:9px; margin-top:4px; }
.action-btn{
  background:transparent; border:none; color:var(--text-muted); font-size:12.5px;
  display:flex; align-items:center; gap:5px; padding:5px 4px;
}
.action-btn:hover{ color: var(--gold); }
.action-btn.liked{ color: var(--red); }
.action-btn svg{ width:15px; height:15px; }

.comments{ margin-top:10px; display:none; }
.comments.open{ display:block; }
.comment{
  display:flex; justify-content:space-between; gap:8px; padding:8px 0;
  border-top:1px solid #223; font-size:12.5px;
}
.comment:first-child{ border-top:none; }
.comment b{ color: var(--steel); font-weight:700; }
.comment-input-row{ display:flex; gap:8px; margin-top:8px; }
.comment-input-row input{
  flex:1; padding:9px 10px; border-radius:7px; border:1px solid var(--border);
  background:#141b24; color:var(--text); font-size:12.5px; outline:none;
}
.comment-input-row input:focus{ border-color:var(--gold); }
.comment-input-row button{
  padding:8px 14px; border-radius:7px; border:none; background:var(--gold); color:#1a1300;
  font-size:12px; font-weight:700;
}
.empty-state{
  text-align:center; color:var(--text-muted); font-size:13px; padding:40px 10px;
  border:1px dashed var(--border); border-radius:var(--radius);
}

/* ---------- Alliance ---------- */
.parchment{
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  border:1px solid var(--border); border-radius: var(--radius);
  padding:22px; font-size:14px; line-height:2; white-space:pre-wrap; min-height:120px;
}
.alliance-meta{ font-size:11px; color:var(--text-muted); margin-top:12px; text-align:left; direction:ltr; }
.alliance-edit-row{ margin-top:14px; display:flex; gap:8px; justify-content:flex-end; }

/* ---------- Calculator ---------- */
.calc-wrap{ max-width:320px; margin:0 auto; }
.calc-screen{
  background:#0d1218; border:1px solid var(--border); border-radius:10px;
  padding:20px 16px; text-align:left; direction:ltr; margin-bottom:14px;
}
.calc-expr{ color:var(--text-muted); font-size:13px; min-height:16px; font-family:'Courier New',monospace; }
.calc-result{ color:var(--gold); font-size:32px; font-weight:800; font-family:'Courier New',monospace; overflow-x:auto; }
.calc-grid{ display:grid; grid-template-columns: repeat(4,1fr); gap:8px; }
.calc-btn{
  padding:16px 0; border-radius:8px; border:1px solid var(--border); background: var(--panel);
  color:var(--text); font-size:16px; font-weight:600;
}
.calc-btn:hover{ border-color: var(--gold); }
.calc-btn.op{ background: var(--panel-2); color: var(--gold); }
.calc-btn.eq{ background: linear-gradient(180deg,#dab741,var(--gold)); color:#1a1300; }
.calc-btn.clear{ color: var(--red); }

/* ---------- Admin panel ---------- */
.admin-section{
  background: var(--panel); border:1px solid var(--border); border-radius: var(--radius);
  padding:16px; margin-bottom:18px;
}
.admin-section h3{ margin:0 0 12px; font-size:14px; color: var(--gold); }
.user-row{
  display:flex; align-items:center; justify-content:space-between;
  padding:9px 0; border-top:1px solid #223; font-size:13px;
}
.user-row:first-child{ border-top:none; }
.user-row .u-role{ font-size:10.5px; padding:2px 8px; border-radius:20px; }
.u-role.admin{ background: rgba(201,162,39,.15); color: var(--gold); }
.u-role.user{ background: rgba(124,147,171,.15); color: var(--steel); }
.new-cred-box{
  margin-top:12px; padding:12px; border-radius:8px; background:#141b24;
  border:1px dashed var(--gold-dim); font-size:13px; line-height:2;
}
.toast{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  background: var(--panel-2); border:1px solid var(--gold); color:var(--text);
  padding:10px 18px; border-radius:8px; font-size:12.5px; z-index:100;
  opacity:0; pointer-events:none; transition: opacity .25s;
}
.toast.show{ opacity:1; }

.back-row{ margin-bottom:16px; }
.loading-line{ text-align:center; color:var(--text-muted); font-size:12.5px; padding:20px; }

</style>
</head>
<body>

  <div class="topbar">
    <div class="who">
      <span class="rank-badge" id="menuRankBadge"></span>
      <div>
        <div class="who-name" id="menuWhoName">-</div>
        <div class="who-role" id="menuWhoRole">-</div>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="adminPanelBtn" style="display:none;" onclick="window.location.href='admin.html'">پنل مدیریت</button>
      <button class="icon-btn" onclick="logout()">خروج</button>
    </div>
  </div>

  <div class="menu-header">
    <div class="emblem-lg">
      <svg viewBox="0 0 64 64" fill="none">
        <path d="M32 4 L58 14 V30 C58 46 47 56 32 60 C17 56 6 46 6 30 V14 Z" fill="#1a222d" stroke="#c9a227" stroke-width="2"/>
        <path d="M32 16 L32 40 M22 24 L42 24" stroke="#c9a227" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>
    <h2>پایگاه فرماندهی</h2>
    <p>یکی از بخش‌ها را انتخاب کنید</p>
  </div>

  <div class="menu-grid">
    <a class="tile" href="notifications.html">
      <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="#c9a227" stroke-width="1.8"><path d="M12 2a6 6 0 00-6 6v3.6c0 .8-.3 1.6-.9 2.2L4 15h16l-1.1-1.2c-.6-.6-.9-1.4-.9-2.2V8a6 6 0 00-6-6z"/><path d="M9 18a3 3 0 006 0"/></svg>
      <div class="tile-label">اطلاعیه‌ها</div>
      <div class="tile-sub">پیام‌های فرماندهی</div>
    </a>
    <a class="tile" href="targets.html">
      <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="#b8433a" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1" fill="#b8433a"/></svg>
      <div class="tile-label">هدف حمله</div>
      <div class="tile-sub">اهداف تعیین‌شده</div>
    </a>
    <a class="tile" href="alliance.html">
      <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="#5f8d5b" stroke-width="1.8"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"/></svg>
      <div class="tile-label">اطلاعات اتحاد</div>
      <div class="tile-sub">وضعیت هم‌پیمانان</div>
    </a>
    <a class="tile" href="calculator.html">
      <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="#7c93ab" stroke-width="1.8"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="12" x2="8" y2="12"/><line x1="12" y1="12" x2="12" y2="12"/><line x1="16" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="12" y1="16" x2="12" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg>
      <div class="tile-label">ماشین‌حساب</div>
      <div class="tile-sub">محاسبات سریع</div>
    </a>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/app.js"></script>
  <script>
    const currentUser = requireAuth();
    if(currentUser) paintTopbar(currentUser);
  </script>
</body>
</html>
